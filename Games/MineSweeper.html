<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫雷</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1a1d2e 0%, #2d3250 100%);
    color: #e8e9f0;
    padding: 20px;
  }
  h1 {
    font-size: 28px;
    letter-spacing: 6px;
    margin-bottom: 16px;
    font-weight: 600;
  }
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .controls button, .controls select {
    background: #3a4066;
    color: #e8e9f0;
    border: 1px solid #4c5480;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 14px;
    cursor: pointer;
    transition: background .15s;
  }
  .controls button:hover, .controls select:hover { background: #4c5480; }
  .status {
    display: flex;
    gap: 24px;
    margin-bottom: 12px;
    font-size: 16px;
    font-variant-numeric: tabular-nums;
  }
  .status .item { display: flex; align-items: center; gap: 6px; }
  .status .label { color: #9aa0c3; font-size: 13px; }
  .board {
    display: grid;
    gap: 2px;
    background: #14162a;
    padding: 8px;
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  .cell {
    width: 32px;
    height: 32px;
    border-radius: 5px;
    background: #4c5480;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: background .08s;
  }
  .cell:hover { background: #5b6399; }
  .cell.revealed {
    background: #262a45;
    cursor: default;
    animation: pop .15s ease;
  }
  .cell.mine { background: #a33a3a; }
  .cell.flagged { background: #6b5b2a; }
  .cell.wrong { background: #7a2a2a; }
  @keyframes pop { from { transform: scale(.7); } to { transform: scale(1); } }
  .n1{color:#6fa8ff}.n2{color:#5fd18b}.n3{color:#ff7a7a}.n4{color:#b48cff}
  .n5{color:#ffb35c}.n6{color:#4fd6c9}.n7{color:#f0f0f0}.n8{color:#9aa0c3}
  .message {
    margin-top: 14px;
    font-size: 18px;
    font-weight: 600;
    height: 26px;
    letter-spacing: 1px;
  }
  .message.win { color: #5fd18b; }
  .message.lose { color: #ff7a7a; }
  .hint { margin-top: 6px; font-size: 12px; color: #7a80a8; }
</style>
</head>
<body>
  <h1>扫 雷</h1>
  <div class="controls">
    <select id="difficulty">
      <option value="easy">初级 9×9 · 10雷</option>
      <option value="medium" selected>中级 16×16 · 40雷</option>
      <option value="hard">高级 30×16 · 99雷</option>
    </select>
    <button id="restart">重新开始</button>
  </div>
  <div class="status">
    <div class="item"><span class="label">💣 剩余雷数</span><span id="mines">40</span></div>
    <div class="item"><span class="label">⏱️ 时间</span><span id="time">0</span></div>
  </div>
  <div class="board" id="board"></div>
  <div class="message" id="message"></div>
  <div class="hint">左键翻开 · 右键插旗 · 双击/中键快速展开</div>

<script>
const DIFF = {
  easy:   { cols: 9,  rows: 9,  mines: 10 },
  medium: { cols: 16, rows: 16, mines: 40 },
  hard:   { cols: 30, rows: 16, mines: 99 },
};

let cols, rows, mineCount;
let grid;          // {mine, revealed, flagged, num}
let started, over, revealedCount, flags, timer, seconds;

const boardEl = document.getElementById('board');
const minesEl = document.getElementById('mines');
const timeEl = document.getElementById('time');
const msgEl = document.getElementById('message');

function init() {
  const d = DIFF[document.getElementById('difficulty').value];
  cols = d.cols; rows = d.rows; mineCount = d.mines;
  grid = Array.from({length: rows}, () =>
    Array.from({length: cols}, () => ({mine:false, revealed:false, flagged:false, num:0})));
  started = false; over = false;
  revealedCount = 0; flags = 0; seconds = 0;
  clearInterval(timer); timer = null;
  minesEl.textContent = mineCount;
  timeEl.textContent = 0;
  msgEl.textContent = '';
  msgEl.className = 'message';
  boardEl.style.gridTemplateColumns = `repeat(${cols}, 32px)`;
  boardEl.innerHTML = '';
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r; cell.dataset.c = c;
      boardEl.appendChild(cell);
    }
  }
}

function cellAt(r, c) { return grid[r][c]; }
function elAt(r, c) { return boardEl.children[r * cols + c]; }

function neighbors(r, c) {
  const out = [];
  for (let dr = -1; dr <= 1; dr++)
    for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) out.push([nr, nc]);
    }
  return out;
}

function placeMines(sr, sc) {
  // 首次点击周围3x3不放雷，保证开局安全
  const safe = new Set([`${sr},${sc}`, ...neighbors(sr, sc).map(([r,c]) => `${r},${c}`)]);
  const spots = [];
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      if (!safe.has(`${r},${c}`)) spots.push([r, c]);
  // 洗牌
  for (let i = spots.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [spots[i], spots[j]] = [spots[j], spots[i]];
  }
  for (let i = 0; i < mineCount; i++) {
    const [r, c] = spots[i];
    cellAt(r, c).mine = true;
  }
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      cellAt(r, c).num = neighbors(r, c).filter(([nr,nc]) => cellAt(nr,nc).mine).length;
}

function startTimer() {
  timer = setInterval(() => { seconds++; timeEl.textContent = seconds; }, 1000);
}

function reveal(r, c) {
  const cell = cellAt(r, c);
  if (cell.revealed || cell.flagged || over) return;
  if (!started) {
    placeMines(r, c);
    started = true;
    startTimer();
  }
  if (cell.mine) { lose(r, c); return; }
  floodReveal(r, c);
  checkWin();
}

function floodReveal(r, c) {
  const stack = [[r, c]];
  while (stack.length) {
    const [cr, cc] = stack.pop();
    const cell = cellAt(cr, cc);
    if (cell.revealed || cell.flagged) continue;
    cell.revealed = true;
    revealedCount++;
    paint(cr, cc);
    if (cell.num === 0)
      for (const [nr, nc] of neighbors(cr, cc))
        if (!cellAt(nr, nc).revealed) stack.push([nr, nc]);
  }
}

function chord(r, c) {
  // 已翻开数字格：周围旗数等于数字时，快速展开周围
  const cell = cellAt(r, c);
  if (!cell.revealed || cell.num === 0 || over) return;
  const ns = neighbors(r, c);
  const f = ns.filter(([nr,nc]) => cellAt(nr,nc).flagged).length;
  if (f !== cell.num) return;
  for (const [nr, nc] of ns) {
    if (!cellAt(nr, nc).flagged && !cellAt(nr, nc).revealed) {
      if (cellAt(nr, nc).mine) { lose(nr, nc); return; }
      floodReveal(nr, nc);
    }
  }
  checkWin();
}

function toggleFlag(r, c) {
  const cell = cellAt(r, c);
  if (cell.revealed || over) return;
  cell.flagged = !cell.flagged;
  flags += cell.flagged ? 1 : -1;
  minesEl.textContent = mineCount - flags;
  paint(r, c);
}

function paint(r, c) {
  const cell = cellAt(r, c);
  const el = elAt(r, c);
  el.className = 'cell';
  if (cell.revealed) {
    el.classList.add('revealed');
    if (cell.mine) { el.classList.add('mine'); el.textContent = '💣'; }
    else if (cell.num > 0) { el.classList.add(`n${cell.num}`); el.textContent = cell.num; }
    else el.textContent = '';
  } else if (cell.flagged) {
    el.classList.add('flagged');
    el.textContent = '🚩';
  } else {
    el.textContent = '';
  }
}

function lose(fr, fc) {
  over = true;
  clearInterval(timer);
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++) {
      const cell = cellAt(r, c);
      if (cell.mine && !cell.flagged) { cell.revealed = true; paint(r, c); }
      if (!cell.mine && cell.flagged) { elAt(r, c).classList.add('wrong'); elAt(r, c).textContent = '❌'; }
    }
  elAt(fr, fc).style.background = '#ff4444';
  msgEl.textContent = '💥 游戏结束，再试一次！';
  msgEl.className = 'message lose';
}

function checkWin() {
  if (revealedCount === rows * cols - mineCount) {
    over = true;
    clearInterval(timer);
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++) {
        const cell = cellAt(r, c);
        if (cell.mine && !cell.flagged) { cell.flagged = true; flags++; paint(r, c); }
      }
    minesEl.textContent = 0;
    msgEl.textContent = `🎉 胜利！用时 ${seconds} 秒`;
    msgEl.className = 'message win';
  }
}

boardEl.addEventListener('click', e => {
  const cell = e.target.closest('.cell');
  if (!cell) return;
  reveal(+cell.dataset.r, +cell.dataset.c);
});

boardEl.addEventListener('contextmenu', e => {
  e.preventDefault();
  const cell = e.target.closest('.cell');
  if (!cell) return;
  toggleFlag(+cell.dataset.r, +cell.dataset.c);
});

boardEl.addEventListener('dblclick', e => {
  const cell = e.target.closest('.cell');
  if (!cell) return;
  chord(+cell.dataset.r, +cell.dataset.c);
});

boardEl.addEventListener('mousedown', e => {
  if (e.button === 1) { // 中键
    e.preventDefault();
    const cell = e.target.closest('.cell');
    if (!cell) return;
    chord(+cell.dataset.r, +cell.dataset.c);
  }
});

document.getElementById('restart').addEventListener('click', init);
document.getElementById('difficulty').addEventListener('change', init);

init();
</script>
</body>
</html>
